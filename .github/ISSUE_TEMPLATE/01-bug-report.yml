name: Bug report
description: Report a reproducible problem with X monitoring.
title: "[Bug]: "
labels: ["needs triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve X monitoring. Please give enough detail for someone else to reproduce the problem.

        Do not include API keys, cookies, session data, or private posts. Report security vulnerabilities through [private security reporting](https://github.com/nextbrowser-oss/nextbrowser-x-monitoring/security/advisories/new).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New posts (Following feed)
        - Follower counts
        - Sign-in detection
        - CLI (x-monitor)
        - Integration in Nextbrowser
        - Documentation
        - Other or not sure
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run x-monitor once --profile ... --verbose
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "For example: v0.1.0 or abc1234"
    validations:
      required: true

  - type: dropdown
    id: front_end
    attributes:
      label: x.com front end
      description: The log's diag.test_ids is 0 on the rewritten front end.
      options:
        - Classic (test ids present)
        - Rewritten (no test ids)
        - Not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Paste the relevant --verbose lines, with handles and post text removed if they are private.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find an open duplicate.
        - label: I removed credentials, cookies, and private content.
