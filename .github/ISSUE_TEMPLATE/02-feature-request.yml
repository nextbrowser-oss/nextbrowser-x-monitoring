name: Feature request
description: Propose an improvement grounded in a clear monitoring need.
title: "[Feature]: "
labels: ["needs triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first so maintainers can find the best solution. The engine is read-only by design: proposals that act on x.com (follow, like, reply) are out of scope here.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What do you want to know about an X account that the monitor does not tell you today?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: What should the monitor report, and how often?
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Page loads and traffic
      description: Which x.com pages would this read, and how often? Every page load costs proxy traffic and account attention.
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      options:
        - Yes, I can contribute an implementation
        - Yes, with maintainer guidance
        - I can help test or document it
        - Not at this time
    validations:
      required: false
