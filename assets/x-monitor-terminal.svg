<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="350" viewBox="0 0 1098 350" role="img" aria-label="Example x-monitor output: new posts from followed accounts and follower-count changes">
  <rect x="0.5" y="0.5" width="1097" height="349" rx="12" fill="#0b1120" stroke="#1f2937"/>
  <path d="M12.5 0.5h1073a12 12 0 0 1 12 12v28h-1097v-28a12 12 0 0 1 12-12z" fill="#111827"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="549" y="25" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">x-monitor — sample output</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#e5e7eb">
    <text x="28" y="72"><tspan fill="#2dd4bf">$</tspan> x-monitor run --profile acme --followers bigco --interval 5m</text>
    <text x="28" y="98" xml:space="preserve"><tspan fill="#6b7280">09:00</tspan>  <tspan fill="#60a5fa">signed in</tspan> as <tspan fill="#c4b5fd">@acme_labs</tspan></text>
    <text x="28" y="124" xml:space="preserve"><tspan fill="#6b7280">09:00</tspan>  <tspan fill="#94a3b8">pass</tspan> <tspan fill="#c4b5fd">@acme_labs</tspan>: feed baseline: 18 entries; followers: 3 read, 0 changed</text>
    <text x="28" y="150" xml:space="preserve"><tspan fill="#6b7280">09:05</tspan>  <tspan fill="#34d399">new post</tspan>  <tspan fill="#c4b5fd">@jane_builds</tspan>: Shipped the new release: 40% faster cold starts.  <tspan fill="#64748b">https://x.com/jane_builds/status/2103250011</tspan></text>
    <text x="28" y="176" xml:space="preserve"><tspan fill="#6b7280">09:05</tspan>  <tspan fill="#34d399">new post</tspan>  <tspan fill="#c4b5fd">@devtools_daily</tspan>: [2 photos]  <tspan fill="#64748b">https://x.com/devtools_daily/status/2103250012</tspan></text>
    <text x="28" y="202" xml:space="preserve"><tspan fill="#6b7280">09:05</tspan>  <tspan fill="#34d399">new post</tspan>  <tspan fill="#c4b5fd">@sam_ops</tspan> replied: Agreed, pin the version and move on.  <tspan fill="#64748b">https://x.com/sam_ops/status/2103250013</tspan></text>
    <text x="28" y="228" xml:space="preserve"><tspan fill="#6b7280">09:05</tspan>  <tspan fill="#94a3b8">pass</tspan> <tspan fill="#c4b5fd">@acme_labs</tspan>: feed: 3 new of 21, 1 scroll</text>
    <text x="28" y="254" xml:space="preserve"><tspan fill="#6b7280">09:30</tspan>  <tspan fill="#60a5fa">followers</tspan> <tspan fill="#c4b5fd">@acme_labs</tspan> <tspan fill="#6b7280">(you)</tspan>: 12,480 → 12,517 <tspan fill="#34d399">(+37)</tspan></text>
    <text x="28" y="280" xml:space="preserve"><tspan fill="#6b7280">09:30</tspan>  <tspan fill="#60a5fa">followers</tspan> <tspan fill="#c4b5fd">@bigco</tspan>: 1,230,000 → 1,240,000 <tspan fill="#34d399">(+10,000)</tspan> <tspan fill="#fbbf24">(rounded)</tspan></text>
    <text x="28" y="306" xml:space="preserve"><tspan fill="#6b7280">09:30</tspan>  <tspan fill="#94a3b8">pass</tspan> <tspan fill="#c4b5fd">@acme_labs</tspan>: feed: 0 new of 19; followers: 3 read, 2 changed</text>
  </g>
</svg>
